<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Kids Planet · Campaign review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600;6..72,700&family=Mukta:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green:#2F5639;--deep:#1C3424;--gold:#C3A25F;--cream:#ECD4A0;--paper:#F5F1E7;--card:#fff;--ink:#16201A;--mute:#5E6B61;--line:#DDD6C6}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Mukta,system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.bar{max-width:1500px;margin:0 auto;padding:12px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bar img{height:46px;width:auto;display:block}
.bar h1{font:700 22px/1.1 Newsreader,serif;margin:0;letter-spacing:.2px}
.bar .sub{color:var(--cream);font-size:13px}
.grow{flex:1}
.filters{max-width:1500px;margin:0 auto;padding:0 20px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:#fff;font:500 14px Mukta;padding:5px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--gold);color:var(--deep)}
select,input{font:15px Mukta;border:0;border-radius:999px;padding:7px 14px;background:#fff;color:var(--ink)}
input{min-width:180px}
.count{color:var(--cream);font-size:14px;margin-left:auto}
nav.camps{max-width:1500px;margin:0 auto;padding:14px 20px 0;display:flex;gap:6px;flex-wrap:wrap}
nav.camps a{font-size:13px;text-decoration:none;color:var(--green);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px}
nav.camps a:hover{border-color:var(--green)}
main{max-width:1500px;margin:0 auto;padding:10px 20px 80px}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:10px 14px;margin:14px 0 4px;font-size:14px;color:var(--mute)}
section{margin-top:34px}
section>h2{font:700 28px/1.15 Newsreader,serif;color:var(--green);margin:0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
section>h2 .num{font:700 14px Mukta;color:#fff;background:var(--green);border-radius:999px;padding:2px 10px;transform:translateY(-4px)}
section>.line{color:var(--mute);font-style:italic;margin:2px 0 12px}
h3{font:700 13px Mukta;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-items:start}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.10)}
.tile.wide{grid-column:span 2}
.thumb{position:relative;background:#E9E4D8;display:flex;align-items:center;justify-content:center}
.thumb img{display:block;width:100%;height:auto}
.play{position:absolute;left:10px;bottom:10px;background:rgba(22,32,26,.82);color:#fff;font:700 12px Mukta;border-radius:999px;padding:4px 10px 3px 8px;display:flex;gap:6px;align-items:center}
.play:before{content:"";border-left:9px solid var(--cream);border-top:6px solid transparent;border-bottom:6px solid transparent}
.meta{padding:8px 10px 10px;font-size:13px;line-height:1.3}
.meta b{display:block;font-weight:600;color:var(--ink)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11px;background:#F0EBDF;color:var(--mute);border-radius:4px;padding:1px 6px}
.tag.logo{background:var(--cream);color:var(--deep)}
.cbox{margin-top:8px;border-top:1px dashed var(--line);padding-top:7px;cursor:auto}
.clist{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.cm{background:#F7F3EA;border-radius:6px;padding:5px 7px;font-size:12.5px;line-height:1.35;word-wrap:break-word}
.cm .who{font-weight:700;color:var(--green)}
.cm .when{color:var(--mute);font-size:11px}
.cm .st{font-size:10px;font-weight:700;border-radius:4px;padding:0 5px;margin-left:4px;background:var(--cream);color:var(--deep)}
.cm .st.done{background:var(--green);color:#fff}
.cm.pending{opacity:.7;font-style:italic}
.cbox textarea{width:100%;min-height:46px;resize:vertical;font:13px/1.35 Mukta,system-ui,sans-serif;color:var(--ink);background:#FBF9F4;border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:block}
.cbox textarea:focus{outline:2px solid var(--gold);outline-offset:0;background:#fff}
.crow{display:flex;gap:6px;align-items:center;margin-top:5px}
.crow .cs{flex:1;font-size:11px;color:var(--mute);min-height:14px}
.crow button{border:0;border-radius:999px;padding:4px 12px;font:700 12px Mukta;cursor:pointer}
.post{background:var(--green);color:#fff}.post:disabled{opacity:.45;cursor:default}
.lnk{background:#F0EBDF;color:var(--mute)}
.tile.has-c{border-color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
.tile.hl{outline:3px solid var(--gold);outline-offset:2px}
.tile .ccount{font-size:11px;font-weight:700;background:var(--gold);color:var(--deep);border-radius:4px;padding:1px 6px}
#who{min-width:140px;max-width:180px}
#sync{font-size:12px;color:var(--cream)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;display:none;max-width:90vw;text-align:center}
#lbc{background:var(--gold)!important;color:var(--deep)!important;font-weight:700!important}
.empty{color:var(--mute);padding:40px 0;text-align:center}
#lb{position:fixed;inset:0;z-index:50;background:rgba(10,14,11,.94);display:none;flex-direction:column}
#lb.on{display:flex}
#lb .top{display:flex;align-items:center;gap:12px;padding:10px 16px;color:#fff}
#lb .top .t{flex:1;font-size:15px}
#lb .top .t small{color:var(--cream);display:block}
#lb button,#lb a{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:500 14px Mukta;cursor:pointer;text-decoration:none}
#lb .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 56px 18px;position:relative}
#lb .stage img,#lb .stage video{max-width:100%;max-height:100%;object-fit:contain;background:#000;border-radius:4px}
#lb .stage.zoom{overflow:auto;align-items:flex-start;justify-content:flex-start}
#lb .stage.zoom img{max-width:none;max-height:none}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:26px!important;padding:10px 14px!important}
#lb .prev{left:8px}#lb .next{right:8px}
@media (max-width:640px){header{position:static}html{scroll-padding-top:10px}.bar{padding:10px 14px;gap:10px}.bar h1{font-size:18px}.bar img{height:30px}.bar .sub{display:none}
.filters{padding:0 14px 10px;gap:6px}.seg button{font-size:13px;padding:4px 9px}select{flex:1 1 45%;min-width:0;padding:6px 10px;font-size:14px}input{flex:1 1 100%;min-width:0;padding:6px 12px}.count{margin-left:0;font-size:12px}
nav.camps{flex-wrap:nowrap;overflow-x:auto;padding:10px 14px 0;-webkit-overflow-scrolling:touch}nav.camps a{white-space:nowrap}
main{padding:6px 14px 60px}.tile.wide{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}section>h2{font-size:22px}
#lb .stage{padding:0 6px 10px}#lb .nav{display:none}#lb .top{flex-wrap:wrap}#lb .top .t{flex:1 1 100%;font-size:14px}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <img src="img/lockup.webp" alt="Kids Planet School · Explore & Excel">
    <div class="grow"><h1>Campaign review</h1><div class="sub">Every advert and film, all campaigns · admissions 2027–28 · draft for review, not for distribution</div></div>
  </div>
  <div class="filters">
    <div class="seg" id="fkind"><button data-v="" class="on">All</button><button data-v="image">Adverts</button><button data-v="video">Films</button></div>
    <div class="seg" id="fver"><button data-v="" class="on">All versions</button><button data-v="Original">Original</button><button data-v="Logo-led">Logo-led</button></div>
    <select id="fch" aria-label="Channel"><option value="">Every channel</option></select>
    <select id="fcamp" aria-label="Campaign"><option value="">Every campaign</option></select>
    <input id="fq" type="search" placeholder="Search…" aria-label="Search">
    <div class="seg" id="fcm"><button data-v="" class="on">All items</button><button data-v="1">With comments</button></div>
    <input id="who" type="text" placeholder="Your name" aria-label="Your name (shown on your comments)" maxlength="80">
    <span class="count" id="count"></span>
    <span id="sync" aria-live="polite"></span>
  </div>
</header>
<nav class="camps" id="camps"></nav>
<main id="main"></main>
<div id="toast" role="status"></div>
<div id="lb" role="dialog" aria-modal="true">
  <div class="top"><div class="t" id="lbt"></div><button id="lbc" title="Comment on this">Comment</button><button id="lbz" title="Actual size (Z)">Zoom</button><a id="lbd" download>Download</a><button id="lbx" title="Close (Esc)">Close ✕</button></div>
  <div class="stage" id="lbs"><button class="nav prev" id="lbp" aria-label="Previous">‹</button><button class="nav next" id="lbn" aria-label="Next">›</button></div>
</div>

    const ad=mine.filter(i=>i.kind==="image").length, fl=mine.length-ad;
    nav+=`<a href="#c${c.n}">${c.n} · ${esc(c.name)}</a>`;
    h+=`<section id="c${c.n}"><h2><span class="num">${c.n}</span>${esc(c.name)}</h2>${c.line?`<div class="line">“${esc(c.line)}”</div>`:""}`;
    ["Original","Logo-led"].forEach(v=>{
      const set=mine.filter(i=>i.version===v); if(!set.length) return;
      [["image","Adverts"],["video","Films"]].forEach(([k,lab])=>{
        const s=set.filter(i=>i.kind===k); if(!s.length) return;
        h+=`<h3>${v==="Logo-led"?"Logo-led versions · ":""}${lab} (${s.length})</h3><div class="grid">`;
        s.forEach(i=>{const idx=shown.indexOf(i), wide=i.w>i.h*2.2;
          h+=`<div class="tile${wide?" wide":""}" id="m-${i.id}" data-i="${idx}" tabindex="0"><div class="thumb"><img loading="lazy" src="${i.thumb}" alt="${esc(i.title)}" width="${i.w}" height="${i.h}">${i.kind==="video"?`<span class="play">${i.dur}s</span>`:""}</div>
          <div class="meta"><b>${esc(i.title)}</b><div class="tags"><span class="tag">${esc(i.channel)}</span><span class="tag">${i.w}×${i.h}</span>${i.version==="Logo-led"?'<span class="tag logo">Logo-led</span>':""}<span class="ccount" style="display:none"></span></div>
          <div class="cbox"><div class="clist"></div><textarea data-k="${i.id}" rows="2" placeholder="Add a comment on this ${i.kind==="video"?"film":"advert"}…" aria-label="Comment on ${esc(i.title)}">${esc(DR[i.id]||"")}</textarea><div class="crow"><span class="cs"></span><button type="button" class="lnk" data-act="link" title="Copy a link to this exact item">🔗 Link</button><button type="button" class="post" data-act="post"${(DR[i.id]||"").trim()?"":" disabled"}>Post</button></div></div></div></div>`;});
        h+=`</div>`;});
    });
    h+=`</section>`;
  });
  $("#main").innerHTML=h||'<div class="empty">Nothing matches these filters.</div>';
  $("#camps").innerHTML=nav;
  shown.forEach(i=>paint(i.id));setSync();
}
function seg(id,key){document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.remove("on"));b.classList.add("on");state[key]=b.dataset.v;render();});}
seg("fkind","kind");seg("fver","ver");seg("fcm","cm");
$("#fch").onchange=e=>{state.ch=e.target.value;render()};
$("#fcamp").onchange=e=>{state.camp=e.target.value;render()};
$("#fq").oninput=e=>{state.q=e.target.value;render()};
let cur=-1;
function open(i){cur=i;const it=shown[i];if(!it)return;const s=$("#lbs");s.classList.remove("zoom");
  s.querySelectorAll("img,video").forEach(e=>e.remove());
  const el=it.kind==="video"?Object.assign(document.createElement("video"),{src:it.full,controls:true,autoplay:true,playsInline:true,poster:it.thumb}):Object.assign(document.createElement("img"),{src:it.full,alt:it.title});
  s.insertBefore(el,$("#lbn"));
  const c=CAMPS.find(c=>c.n===it.campaign);
  $("#lbt").innerHTML=`${esc(it.title)}<small>${c?c.n+" · "+esc(c.name):""} · ${esc(it.channel)} · ${it.w}×${it.h}${it.dur?" · "+it.dur+" s":""}${it.version==="Logo-led"?" · Logo-led":""} · ${i+1} of ${shown.length}</small>`;
  $("#lbd").href=it.full;$("#lbz").style.display=it.kind==="image"?"":"none";
  $("#lb").classList.add("on");document.body.style.overflow="hidden";
  const n=commentsFor(it.id).length;$("#lbc").textContent=n?`Comments (${n})`:"Comment";
  try{history.replaceState(null,"","#m="+it.id)}catch(e){}}
function close(){if(!$("#lb").classList.contains("on"))return;$("#lb").classList.remove("on");try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}$("#lbs").querySelectorAll("video").forEach(v=>v.pause());document.body.style.overflow="";}
$("#main").addEventListener("click",e=>{if(e.target.closest(".cbox"))return;const t=e.target.closest(".tile");if(t)open(+t.dataset.i)});
$("#main").addEventListener("keydown",e=>{if(e.target.closest(".cbox"))return;const t=e.target.closest(".tile");if(t&&e.key==="Enter")open(+t.dataset.i)});
$("#main").addEventListener("input",e=>{const t=e.target.closest(".cbox textarea");if(!t)return;const k=t.dataset.k;
  if(t.value.trim())DR[k]=t.value;else delete DR[k];LS.set("kp-review-drafts",DR);
  t.parentNode.querySelector(".post").disabled=!t.value.trim();
  const cs=t.parentNode.querySelector(".cs");cs.textContent="Draft saved";clearTimeout(t._t);t._t=setTimeout(()=>cs.textContent="",1500);});
$("#main").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const id=b.closest(".tile").id.slice(2);
  if(b.dataset.act==="post")post(id);else link(id);});
$("#main").addEventListener("keydown",e=>{const t=e.target.closest(".cbox textarea");if(t&&e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();post(t.dataset.k)}});
$("#who").value=LS.get("kp-review-name","");$("#who").oninput=e=>LS.set("kp-review-name",e.target.value.trim());
$("#lbc").onclick=()=>{const it=shown[cur];close();focusItem(it.id,true)};
function focusItem(id,typing){const t=document.getElementById("m-"+id);if(!t)return;t.scrollIntoView({block:"center"});t.classList.add("hl");setTimeout(()=>t.classList.remove("hl"),2500);if(typing)t.querySelector("textarea").focus({preventScroll:true});}
function fromHash(){const m=location.hash.match(/^#m=([\w-]+)/);if(!m||!BYID[m[1]])return;const id=m[1];
  if(!shown.some(i=>i.id===id)){state.kind=state.ver=state.ch=state.camp=state.q=state.cm="";["fkind","fver","fcm"].forEach(g=>document.querySelectorAll(`#${g} button`).forEach((b,k)=>b.classList.toggle("on",k===0)));$("#fch").value=$("#fcamp").value=$("#fq").value="";render();}
  focusItem(id);open(shown.findIndex(i=>i.id===id));}
window.addEventListener("hashchange",fromHash);
$("#lbx").onclick=close;$("#lbp").onclick=()=>open((cur-1+shown.length)%shown.length);$("#lbn").onclick=()=>open((cur+1)%shown.length);
$("#lbz").onclick=()=>$("#lbs").classList.toggle("zoom");
document.addEventListener("keydown",e=>{if(!$("#lb").classList.contains("on"))return;
  if(e.key==="Escape")close();else if(e.key==="ArrowLeft")$("#lbp").click();else if(e.key==="ArrowRight")$("#lbn").click();else if(e.key.toLowerCase()==="z")$("#lbz").click();});
$("#lbs").addEventListener("click",e=>{if(e.target.id==="lbs")close()});
render();fromHash();flush();pull();setInterval(pull,60000);
</script>
</body>
</html>
